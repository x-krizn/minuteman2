<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#c4cfa1"/>
  <!-- Screen Bezel -->
  <rect x="64" y="60" width="384" height="230" rx="20" fill="#8b956d"/>
  <rect x="96" y="80" width="320" height="190" rx="10" fill="#0f300f" stroke="#00ff3355" stroke-width="6"/>
  <!-- LCD Text / Logo -->
  <text x="256" y="165" font-family="monospace" font-size="32" font-weight="bold" fill="#00ff33" text-anchor="middle" letter-spacing="4">MINUTEMAN</text>
  <text x="256" y="210" font-family="monospace" font-size="16" fill="#00ff33aa" text-anchor="middle" letter-spacing="3">GAMES, BUDDY.</text>
  
  <!-- D-Pad (Left side) -->
  <g transform="translate(130, 370)">
    <rect x="-18" y="-55" width="36" height="110" rx="4" fill="#303030" stroke="#101010" stroke-width="4"/>
    <rect x="-55" y="-18" width="110" height="36" rx="4" fill="#303030" stroke="#101010" stroke-width="4"/>
    <rect x="-18" y="-18" width="36" height="36" fill="#303030"/>
    <circle cx="0" cy="0" r="8" fill="#202020"/>
  </g>

  <!-- ABXY Action Buttons (Right side diamond) -->
  <g transform="translate(380, 370)">
    <!-- Y -->
    <circle cx="-32" cy="-32" r="18" fill="#8b1d40" stroke="#4a0016" stroke-width="3"/>
    <!-- X -->
    <circle cx="32" cy="-32" r="18" fill="#8b1d40" stroke="#4a0016" stroke-width="3"/>
    <!-- B -->
    <circle cx="-32" cy="32" r="18" fill="#8b1d40" stroke="#4a0016" stroke-width="3"/>
    <!-- A -->
    <circle cx="32" cy="32" r="18" fill="#8b1d40" stroke="#4a0016" stroke-width="3"/>
  </g>

  <!-- System Buttons (Center bottom) -->
  <g transform="translate(256, 455)">
    <rect x="-45" y="-6" width="36" height="12" rx="6" fill="#505050" stroke="#202020" stroke-width="2" transform="rotate(-25, -27, 0)"/>
    <rect x="10" y="-6" width="36" height="12" rx="6" fill="#505050" stroke="#202020" stroke-width="2" transform="rotate(-25, 28, 0)"/>
  </g>
</svg>
